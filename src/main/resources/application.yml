spring:
  profiles:
    active: local
  application:
    name: super-ai-agent
  #  datasource:
  #    url: jdbc:mysql://localhost:3306/super_ai_agent?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
  #    username: root
  #    password: ${MYSQL_PASSWORD}
  #    driver-class-name: com.mysql.cj.jdbc.Driver
  datasource:
    url: jdbc:postgresql://47.238.245.170:5432/super_ai_agent
    username: user
    password: ${POSTGRESQL_PASSWORD}

  ai:
    # 11 向量存储配置
    vectorstore:
      pgvector:
        index-type: HNSW # 向量索引类型  注意HNSW最高支持2000维度
        distance-type: COSINE_DISTANCE # 计算向量相似度的算法 COSINE_DISTANCE代表余弦相似度
        dimensions: 1536 # Embedding 模型输出向量的维度数 值在建表时会被写死到列定义 根据模型支持填写，不要超过模型支持的上限
        max-document-batch-size: 10000 # 批量写入时，一次最多处理多少条文档
        initialize-schema: true # 首次启动自动建表
        # remove-existing-vector-store-table: true # 每次启动都重新建表 测试时用

    dashscope:
      base-url: https://ws-zf7fyoe2mdv3llp0.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}

    openai:
      base-url: https://api.siliconflow.cn/v1
      api-key: ${SILICONFLOW_API_KEY}
      # chat模型
      chat:
        model: deepseek-ai/DeepSeek-V4-Flash
      # 向量化模型
      embedding:
        model: Qwen/Qwen3-Embedding-4B
        dimensions: 1536 # 11指定向量维度，有固定的几个值，不是随变写

    # ChatMemoryRespository对话记忆存储
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always  # 首次启动自动建表

# 后端配置
server:
  # 启动端口
  port: 8123
  servlet:
    # 访问前缀
    context-path: /api

# knife4j配置 访问localhost:8123/api/doc.html
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      # 接口路径
      packages-to-scan: com.wty.superaiagent.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
